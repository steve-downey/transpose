# papers/defaults.yaml
# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception
#
# Per-paper pandoc defaults, layered after MPark.WG21's own `doc` and
# `formatting` defaults by base.mk's `-d $(DEFAULTS)`. It exists so the wording
# fragments that `make wording` generates can be spliced into a paper without
# patching the vendored subtree under wg21/.
#
# A defaults file *appends* to a list-valued key rather than replacing it --
# verified against the pinned pandoc 3.9.0.2 -- so only the filters this paper
# adds belong here. Restating the whole chain ran `citeproc` a second time and
# emitted the bibliography twice.
#
# The effective chain is doc.yaml's `citetitle.py, citeproc, wg21.py` followed
# by the three below. Transclusion therefore lands between the two `wg21.py`
# passes, and the second pass is what sees the `[x]{.pnum}` and
# `[stable.name]{- .sref}` spans inside a spliced fragment -- they reach it
# exactly as if they had been typed into the paper. bibliography-header.py sits
# after the single `citeproc` and before that second `wg21.py`, which is the
# only place it can do its job.

filters:
  - filters/transclude.py
  - filters/bibliography-header.py
  - wg21.py
