---
source-root: ..
input:
  - ../include
exclude:
  - ../include/beman/transpose/detail
exclude-patterns:
  - ../include/beman/transpose/detail/**
  - ../tests/**
  - ../examples/**
includes:
  - ../include
file-patterns:
  - '*.hpp'
include-symbols:
  - 'beman::transpose::**'
implementation-defined:
  - 'beman::transpose::detail'
multipage: true
generator: adoc
output: adoc
